services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ztg
      POSTGRES_USER: ztg
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ztg"]
      interval: 5s
      timeout: 5s
      retries: 5
