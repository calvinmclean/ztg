version: "2"
sql:
  - engine: "sqlite"
    queries: "identity/store/queries/"
    schema: "identity/store/schema/"
    gen:
      go:
        package: "sqlc"
        out: "identity/store/sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false